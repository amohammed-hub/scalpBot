# D23 — Post-deploy smoke test
# Runs against the LIVE production server (scalpbot.up.railway.app) after
# every push/merge to main, verifying the Demo Safety mechanics end-to-end:
#   1. flagState — demo-safety loader is healthy, test sessions start clean
#   2. roundTrip — flip ON (must lock) → flip OFF (must fully clear, slots too)
#   3. egress    — unknown/empty sessions must never appear demo-locked
#   4. startGuard — refusal while ON, allowance while OFF
#
# These probes exercise the EXACT demo-safety paths without starting bots,
# placing orders, or touching any user session.
#
# Optional repo secret SMOKE_TEST_TOKEN (same value as Railway env) makes CI
# use the authoritative secret; otherwise the public default applies (accepted
# by production only when no env secret is set — which is the case once the
# repo secret is configured, so configure it to stay fully strict).
name: Post-Deploy Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deploy to roll out
        run: sleep 180

      - name: Run Demo Safety smoke probes
        env:
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          BASE="https://scalpbot.up.railway.app/api/trpc"

          # Secret preference: repo secret > committed smoke secret > public default.
          # The server accepts this committed secret ONLY when no Railway env
          # secret is configured, so production (env set) remains strict while
          # CI can authenticate with the same authoritative value.
          COMMITTED_SMOKE_SECRET="85bee6e7c72c1b16cdc1373861f67491"
          SECRET="${SMOKE_TEST_TOKEN:-$COMMITTED_SMOKE_SECRET}"
          # If the chosen secret is rejected but the default works, fall back
          # (handles the case where Railway has no env secret yet).
          test_secret() {
            local sec=$1
            local out
            out=$(curl -s -m 20 -G "$BASE/smoke.flagState" --data-urlencode "input={\"json\":{\"secret\":\"$sec\"}}")
            echo "$out" | python3 -c "import sys,json,os; d=json.load(sys.stdin); sys.exit(0 if 'result' in d else 1)" 2>/dev/null
          }
          if [ -n "$SMOKE_TEST_TOKEN" ] && ! test_secret "$SMOKE_TEST_TOKEN"; then
            if test_secret "$COMMITTED_SMOKE_SECRET"; then
              SECRET="$COMMITTED_SMOKE_SECRET"
            fi
          fi
          echo "Using secret: ${SECRET:0:4}****"

          check() {
            local name=$1 path=$2 expect=$3
            local out
            out=$(curl -sf -m 20 -G "$BASE/$path" --data-urlencode "input={\"json\":{\"secret\":\"$SECRET\"}}")
            echo "[$name] $out"
            # expect is a jq expression that must be truthy
            local val
            val=$(echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{'data':None}).get('data',{}).get($expect))" 2>/dev/null)
            if [ "$val" = "True" ]; then echo "[$name] PASS"; else echo "[$name] FAIL (expected $expect)"; exit 1; fi
          }

          check "flagState"   "smoke.flagState"   "'loadedFromDb'"
          check "roundTrip.on"   "smoke.roundTrip" "'flippedOn'"
          check "roundTrip.off"  "smoke.roundTrip" "'flippedOff'"
          check "roundTrip.slots" "smoke.roundTrip" "'clearAfterOff'"
          check "egress.empty"   "smoke.egress"    "'emptyTokenAllowed'"
          check "egress.random"  "smoke.egress"    "'randomTokenAllowed'"
          check "startGuard.on"  "smoke.startGuard" "'refusesLiveStartWhileOn'"
          check "startGuard.off" "smoke.startGuard" "'permitsLiveStartWhileOff'"

          echo "ALL SMOKE PROBES PASSED"

      - name: Reject invalid secrets (security check)
        run: |
          curl -s -m 20 -G "https://scalpbot.up.railway.app/api/trpc/smoke.flagState" --data-urlencode "input={\"json\":{\"secret\":\"wrong-secret-value\"}}" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'result' not in d or 'error' in d.get('result',{}), d; print('bad-secret probe correctly rejected')"
